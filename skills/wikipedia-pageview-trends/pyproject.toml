[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wikitrends"
version = "0.1.0"
description = "Analyze Wikimedia pageview trends across languages/topics for B2C product decisions."
requires-python = ">=3.11"
dependencies = [
    "requests==2.34.2",
    "matplotlib==3.11.2",
    "reportlab==5.0.1",
    "numpy==2.5.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-socket==0.8.1",
    "responses==0.26.3",
    "pypdf==5.9.0",
]

[project.scripts]
wikitrends = "skill.cli:main"

[tool.setuptools.packages.find]
include = ["skill*"]
